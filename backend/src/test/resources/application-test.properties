# Activated by @ActiveProfiles("test"). Layers on top of application.properties,
# so only the database is redirected — tests never touch your real Postgres.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Each run starts from an empty schema built out of the @Entity classes.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
