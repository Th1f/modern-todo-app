spring.application.name=backend

# File-based H2 — survives restarts, no server to install
spring.datasource.url=jdbc:h2:file:./data/todos
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates/updates tables from your @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Browse the DB at http://localhost:8080/h2-console
spring.h2.console.enabled=true
